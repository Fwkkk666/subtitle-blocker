name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build Windows exe
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --noconsole --name SubtitleBlocker main.py

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: pyinstaller --windowed --name SubtitleBlocker main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleBlocker-${{ matrix.artifact }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
          fail_on_unmatched_files: false
